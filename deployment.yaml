
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-practical
  template:
    metadata:
      labels:
        app: devops-practical
    spec:
      containers:
        - name: flask-app
          image: bmhabandara/devops-practical:v1
          ports:
            - containerPort: 5000
